# locallm-valet configuration example — a local LLM valet
# (SGLang / vLLM / llama.cpp / OpenVINO ...)
# Copy to config.yaml and adjust. See README.md / README.zh-CN.md.

server:
  host: 0.0.0.0
  port: 8000          # the only client-facing entry (OpenAI-compatible)
  # API-key auth: when set, every /v1/* and /gateway/* data endpoint requires
  # `Authorization: Bearer <key>` (401 otherwise). A list of keys is allowed.
  # Unset = open access. Env: LOCALLM_VALET_API_KEY (comma-separated).
  # api_key: sk-your-key-here

backend:
  # The managed inference backend: internal port, reachable only from the
  # gateway (clients never talk to it directly).
  host: 127.0.0.1
  port: 30000
  health_path: /health        # stricter readiness: e.g. /health_generate
  startup_timeout_seconds: 600
  stop_timeout_seconds: 60

  # Launch command template — the core of backend-agnosticism.
  # Placeholders: {python} {model_path} {model_name} {host} {port} {device} {extra_args}
  # NOTE: {python} is the gateway's own interpreter; if the backend lives in
  # another environment (e.g. conda), write the full interpreter path inline.
  #
  # One line per backend — pick yours (the global template applies to every
  # model that does NOT define its own; see the mixed-backend example below):
  #
  #   # SGLang
  #   command_template: "{python} -m sglang.launch_server --model-path {model_path} --host {host} --port {port} --tp-size 1 {extra_args}"
  #   # vLLM (also add --served-model-name <registry name> in extra_args so
  #   # the model field matches; see the mixed example below)
  #   command_template: "{python} -m vllm.entrypoints.openai.api_server --model {model_path} --host {host} --port {port} {extra_args}"
  #   # llama.cpp (Linux / macOS / Windows — an .exe path works directly)
  #   command_template: "llama-server -m {model_path} --host {host} --port {port} {extra_args}"
  #   # OpenVINO GenAI (custom OpenAI-compatible server, CPU/NPU)
  #   command_template: "{python} -m my_openvino_server --model {model_path} --port {port} {extra_args}"
  #
  # Active on this machine (conda env qwen3.5 + SGLang):
  command_template: "/home/test/anaconda3/envs/qwen3.5/bin/python -m sglang.launch_server --model-path {model_path} --host {host} --port {port} --tp-size 1 {extra_args}"

  # Global env for the backend child (CUDA_VISIBLE_DEVICES=<memory.device> is
  # appended automatically; meaningful for CUDA backends only).
  env:
    SGLANG_USE_MODELSCOPE: "true"

memory:
  device: 0                     # CUDA only (CUDA_VISIBLE_DEVICES)
  safety_margin_gib: 4.0        # start threshold = required_vram/ram_gib + this
  release_timeout_seconds: 120  # wait for VRAM to settle after stop (NVML only)
  poll_interval_seconds: 1.0

# Idle auto-unload (configurable, never hardcoded):
#   state==RUNNING and active_requests==0 and now-last_activity >= timeout_seconds
#   -> stop the backend and release resources.
# Env override: LOCALLM_VALET_IDLE_TIMEOUT_SECONDS=1800
idle:
  timeout_seconds: 3600
  check_interval_seconds: 15

# Token usage tracking + dashboard (SQLite; GET /gateway/dashboard)
usage:
  enabled: true
  db_path: data/usage.db

models:
  # ---- Measured on this machine (RTX 4090 48G): SGLang + Qwen3.6-35B-A3B-FP8 ----
  # VRAM gate: 39 + 4 margin = 43 < 48 - external usage (~3.2G desktop)
  # RAM gate:  32 + 4 margin = 36 < available RAM
  qwen3.6-35b:
    path: /home/test/models/modelscope/models/Qwen/Qwen3___6-35B-A3B-FP8
    required_vram_gib: 39       # VRAM gate: the primary criterion for GPU
                                # backends (hard failure if insufficient)
    required_ram_gib: 0         # RAM gate is OPT-IN. GPU serving gates on
                                # VRAM alone (swap = slow but works); set a
                                # value here mainly for CPU/NPU backends
                                # (llama.cpp / OpenVINO), where RAM IS the
                                # compute resource
    backend:
      extra_args:
        - --mem-fraction-static
        - "0.87"
        - --context-length
        - "262144"
        - --reasoning-parser
        - qwen3
        - --tool-call-parser
        - qwen3_coder
        - --kv-cache-dtype
        - fp8_e4m3

  # ---- CPU/NPU machine example (Windows + OpenVINO, no NVIDIA driver) ----
  # Leave required_vram_gib unset (or 0): the VRAM gate is skipped when NVML
  # is unavailable; only the RAM gate applies.
  # qwen2.5-1.5b-openvino:
  #   path: C:\models\qwen2.5-1.5b-openvino
  #   required_ram_gib: 8        # weights + runtime overhead
  #   backend:
  #     extra_args: ["--device", "NPU"]   # or CPU

  # ---- llama.cpp example (Windows/Linux) ----
  # llama3.2-3b-gguf:
  #   path: C:\models\llama-3.2-3b-instruct-q8.gguf
  #   required_ram_gib: 8
  #   backend:
  #     extra_args: ["--ctx-size", 8192, "-ngl", 0]

  # ---- MIXED BACKENDS: vLLM and llama.cpp in one registry ----
  # Per-model backend.command_template overrides the global one; per-model
  # backend.health_path likewise. Only one model runs at a time, so the
  # shared internal port (30000) never collides.
  # vllm-qwen2.5-7b:
  #   path: /models/Qwen2.5-7B-Instruct
  #   required_vram_gib: 18
  #   backend:
  #     command_template: "{python} -m vllm.entrypoints.openai.api_server --model {model_path} --host {host} --port {port} {extra_args}"
  #     extra_args: ["--served-model-name", "vllm-qwen2.5-7b"]
  # llama3.2-3b-gguf:
  #   path: C:\models\llama-3.2-3b-instruct-q8.gguf
  #   required_ram_gib: 8
  #   backend:
  #     command_template: "llama-server -m {model_path} --host {host} --port {port} {extra_args}"
  #     health_path: /health
  #     extra_args: ["--ctx-size", 8192]
