# llm-gateway 配置示例 —— 后端无关（SGLang / vLLM / llama.cpp / OpenVINO ...）
# 复制为 config.yaml 后按需修改。

server:
  host: 0.0.0.0
  port: 8000          # 客户端唯一入口（OpenAI-compatible）
  # API-key 认证：设置后所有 /v1/* 与 /gateway/* 数据接口要求
  # `Authorization: Bearer <key>`（401 否则）。支持多个 key 的列表。
  # 未设置 = 不认证（本地全开）。环境变量 LLM_GATEWAY_API_KEY（逗号分隔多 key）。
  # api_key: sk-your-key-here

backend:
  # 被托管的推理后端：监听内部端口，只允许本机（manager）访问
  host: 127.0.0.1
  port: 30000
  health_path: /health        # 更严格的就绪检查可用 /health_generate 等
  startup_timeout_seconds: 600
  stop_timeout_seconds: 60

  # 启动命令模板（高泛用性核心）：占位符
  #   {python} {model_path} {model_name} {host} {port} {device} {extra_args}
  # 注意：{python} 是网关自己的解释器；后端装在别的环境（如 conda）时，
  # 直接把解释器完整路径写进模板（见下方 SGLang 示例）。
  # 不写 backend.command_template 时默认用 SGLang 模板（见下）。
  # 其他后端只需覆盖这一行：
  #
  # vLLM:
  #   command_template: "{python} -m vllm.entrypoints.openai.api_server --model {model_path} --host {host} --port {port} {extra_args}"
  #
  # llama.cpp (Linux/macOS):
  #   command_template: "llama-server -m {model_path} --host {host} --port {port} {extra_args}"
  # llama.cpp (Windows):
  #   command_template: "C:\\llama.cpp\\llama-server.exe -m {model_path} --host {host} --port {port} {extra_args}"
  #
  # OpenVINO GenAI（自定义 OpenAI 兼容服务，CPU/NPU）:
  #   command_template: "{python} -m my_openvino_server --model {model_path} --port {port} {extra_args}"
  #
  # SGLang（默认，注释掉即为默认值）:
  # command_template: "{python} -m sglang.launch_server --model-path {model_path} --host {host} --port {port} --tp-size 1 {extra_args}"

  # 全局环境变量（自动附加 CUDA_VISIBLE_DEVICES=<memory.device>，仅 CUDA 后端有意义）
  env:
    SGLANG_USE_MODELSCOPE: "true"

memory:
  device: 0                     # 仅对 CUDA 后端有意义（CUDA_VISIBLE_DEVICES）
  safety_margin_gib: 4.0        # 门槛 = required_vram/ram_gib + 该余量
  release_timeout_seconds: 120  # 停止后等显存真正释放（NVML 可用时）
  poll_interval_seconds: 1.0

# 空闲自动卸载（可配置！不硬编码）：
#   state==RUNNING 且 active_requests==0 且 距上次请求结束 >= timeout_seconds → 停止后端释放资源
# 也可用环境变量覆盖：LLM_GATEWAY_IDLE_TIMEOUT_SECONDS=1800
idle:
  timeout_seconds: 3600
  check_interval_seconds: 15

# token 用量统计 + 看板（SQLite 落盘，看板：GET /gateway/dashboard）
usage:
  enabled: true
  db_path: data/usage.db

models:
  # ---- 本机（RTX 4090 48G）实测配置：SGLang + Qwen3.6-35B-A3B-FP8 ----
  # 显存门槛：required_vram_gib(40) + margin(4) = 44 < 48 - 外部占用(3.2G)
  # 内存门槛：required_ram_gib(32) + margin(4) = 36 < 可用 RAM
  qwen3.6-35b:
    path: /home/test/models/modelscope/models/Qwen/Qwen3___6-35B-A3B-FP8
    required_vram_gib: 40       # 0/省略 = 不检查显存（如 CPU/NPU 后端；无 NVML 自动跳过）
    required_ram_gib: 32        # 0/省略 = 不检查内存
    backend:
      extra_args:
        - --mem-fraction-static
        - "0.87"
        - --context-length
        - "262144"
        - --reasoning-parser
        - qwen3
        - --tool-call-parser
        - qwen3_coder
        - --kv-cache-dtype
        - fp8_e4m3

  # ---- CPU/NPU 机器示例（Windows + OpenVINO，无 NVIDIA 驱动）----
  # 不写 required_vram_gib（或写 0）：显存检查自动跳过（NVML 不可用），只查内存
  # qwen2.5-1.5b-openvino:
  #   path: C:\models\qwen2.5-1.5b-openvino
  #   required_ram_gib: 8        # 模型权重 + 运行时开销
  #   backend:
  #     extra_args: ["--device", "NPU"]   # 或 CPU

  # ---- llama.cpp 示例（Windows/Linux 通用）----
  # llama3.2-3b-gguf:
  #   path: C:\models\llama-3.2-3b-instruct-q8.gguf
  #   required_ram_gib: 8
  #   backend:
  #     extra_args: ["--ctx-size", "8192", "-ngl", "0"]
