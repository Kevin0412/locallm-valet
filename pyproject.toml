[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "locallm-valet"
version = "0.5.0"
description = "locallm-valet: a local LLM valet — on-demand start/switch/unload of a single inference backend (SGLang / vLLM / llama.cpp / OpenVINO ...) on your own machine via the OpenAI API `model` field, with VRAM+RAM gating."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "psutil>=5.9",
    "nvidia-ml-py>=11.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
locallm-valet = "locallm_valet.__main__:main"

[tool.setuptools.packages.find]
include = ["locallm_valet*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
