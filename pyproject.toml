[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-gateway"
version = "0.4.0"
description = "Backend-agnostic LLM lifecycle gateway: on-demand start/switch of a single inference backend (SGLang / vLLM / llama.cpp / OpenVINO ...) via the OpenAI API `model` field, VRAM+RAM gating, idle auto-unload, fixed client-facing endpoint."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "psutil>=5.9",
    "nvidia-ml-py>=11.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
llm-gateway = "llm_gateway.__main__:main"

[tool.setuptools.packages.find]
include = ["llm_gateway*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
